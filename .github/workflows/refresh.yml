name: refresh-playlists

on:
  schedule:
    # 20:00 UTC = 04:00 Asia/Shanghai
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-playlists
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build playlists
        shell: pwsh
        run: ./build-playlists.ps1

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hd.m3u lunbo.m3u
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "refresh playlists"
            git push
          fi
